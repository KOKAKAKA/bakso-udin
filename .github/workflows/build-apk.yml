name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Buat project Android
        run: npx cap add android

      - name: Pasang ikon Udin
        run: |
          pip install pillow
          python3 scripts/apply-icon.py

      - name: Sinkron web ke Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Ganti nama APK jadi bakso-udin.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bakso-udin.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: bakso-udin
          path: bakso-udin.apk
